name: Deploy Hillview site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exclude admin page and fix root-absolute links
        run: |
          rm -f out/admin.html out/admin.txt
          rm -rf out/admin
          find out -type f -name '*.html' -exec perl -i -pe 's#(href|src)="/(?!Hillview/)#$1="/Hillview/#g' {} +
          find out -type f -name '*.txt' -exec perl -i -pe 's#"(href|src)":"/(?!Hillview/)#"$1":"/Hillview/#g' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
